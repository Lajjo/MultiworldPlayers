hot, Lens Shadow, Lens Shadow Platform, Lens Bongo, Shadow Umbrella Hover, Shadow Umbrella Clip, Shadow Umbrella GS, Shadow Freestanding Key, Shadow Statue, Shadow Bongo, Lens Spirit, Spirit Child Chu, Spirit Lobby GS, Spirit Lower Adult Switch, Spirit Lobby Jump, Spirit Platform Hookshot, Spirit Map Chest, Spirit Sun Chest, Spirit Wall, Ice Block GS, Lens GTG, GTG Without Hookshot, GTG Fake Wall, Lens Ganon, Ganon Spirit Trial Hookshot, Damage Boost, Ground Jump, Ground Jump Hard, Hookshot Extension, Bottom of the Well Navi Dive, Lost Wood Navi Dive
